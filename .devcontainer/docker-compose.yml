version: "3.8"

services:
  app:
    build:
      # Use the repo root as the build context so the Dockerfile can COPY from docker/
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: nrdb-devcontainer
    environment:
      SYMFONY_ENV: dev
      APACHE_LOG_DIR: /var/log/apache2
    ports:
      - "8080:8080"
    volumes:
      # Mount the entire project into the container working directory
      - ..:/var/www/html/nrdb:cached
      # Mount the sibling card-data repo (netrunner-cards-json lives next to netrunnerdb on disk)
      - ../../netrunner-cards-json:/var/www/html/netrunner-cards-json:cached
    depends_on:
      db:
        condition: service_healthy
      postgres:
        condition: service_healthy

  db:
    image: "mysql:8"
    container_name: nrdb-devcontainer-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: passwd
      MYSQL_DATABASE: nrdb-dev
      MYSQL_USER: nrdb-dev
      MYSQL_PASSWORD: passwd
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "nrdb-dev", "-ppasswd"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:14.5
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-db-user.sql:/docker-entrypoint-initdb.d/create-db-user.sql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nrdb_api_development
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  dbdata:
  postgres-data:
