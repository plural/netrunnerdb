# .devcontainer/parameters.yml
# This file is used by post-create.sh to bootstrap app/config/parameters.yml.
# It is pre-wired to the MySQL service defined in .devcontainer/docker-compose.yml.
# Copy and customise if you need different values.
parameters:
    # "db" is the docker-compose service name defined in .devcontainer/docker-compose.yml
    database_host: db
    database_port: ~
    database_name: nrdb-dev
    database_user: nrdb-dev
    database_password: passwd

    mailer_transport: smtp
    mailer_host: 127.0.0.1
    mailer_user: ~
    mailer_password: ~

    email_sender_address: nrdb@example.com
    email_sender_name: nrdb

    secret: ThisTokenIsNotSoSecretChangeIt

    locale: en
    long_cache: 86400
    short_cache: 600
    assets_version: 1
    locale_names:
        en: English
        de: Deutsch
        fr: Français
        es: Español
        it: Italiano
        pl: Polskie
        kr: 한국어
        jp: 日本語
        zh: 中文
    supported_locales:
        - en
    oauth_test_client_id: ~
    oauth_test_client_secret: ~
    oauth_test_redirect_uri: ~
    images_path: ~
    v3_api_url: 'https://api.netrunnerdb.com'
    card_image_url: 'https://card-images.netrunnerdb.com/v2'
